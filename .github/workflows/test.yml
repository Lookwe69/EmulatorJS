name: Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '26'

    - name: Install dependencies
      run: npm install
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Run smoke test
      run: npm test
